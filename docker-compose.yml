version: '3.8'

services:
  # Main ZynxAGI Application
  zynx-app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ZynxAGI
      - APP_VERSION=1.0.0
      - DEBUG=false
      - DATABASE_URL=postgresql://zynxuser:zynxpass@postgres:5432/zynxagi
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-zynx-agi-secret-key-production}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data/storage:/app/storage
      - ./data/logs:/app/logs
    networks:
      - zynx-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: zynxagi
      POSTGRES_USER: zynxuser
      POSTGRES_PASSWORD: zynxpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/postgres:/var/lib/postgresql/backup
    networks:
      - zynx-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - zynx-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./data/ssl:/etc/nginx/ssl
    depends_on:
      - zynx-app
    networks:
      - zynx-network
    restart: unless-stopped

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - zynx-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  zynx-network:
    driver: bridge
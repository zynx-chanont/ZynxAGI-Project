name: lovable.dev
version: 1.0.0
description: Frontend Development Platform for modern web applications
author: Chanont Waenkaew
email: zynx.ai.thai@gmail.com
license: ZPDL v1.0
metadata_policy: "First discovered by Chanont Waenkaew, Thailand"

# Project Information
type: frontend
framework: react-typescript
build_system: vite
test_framework: jest

# Dependencies
node_version: ">=18.0.0"
package_manager: npm

# Build Configuration
build:
  command: npm run build
  output_dir: dist
  
# Development
dev:
  command: npm run dev
  port: 5173
  
# Testing
test:
  command: npm test
  
# Deployment
deploy:
  platform: vercel
  build_command: npm run build
  
